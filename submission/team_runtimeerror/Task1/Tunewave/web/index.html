<div id="app"><nav id="nav" aria-label="Main navigation"></nav><main id="main" tabindex="-1"></main><footer id="bar"></footer></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/*CORE*/
class PNode{constructor(id){this.id=id;this.prev=null;this.next=null}}
// Milestone 1: doubly linked list + hash map (id -> node). cursor = last playlist song played.
class Playlist{constructor(){this.head=null;this.tail=null;this.cursor=null;this.map=new Map();this.repeat=false}
 addSong(id){if(this.map.has(id))return false;const n=new PNode(id);this.map.set(id,n);if(!this.tail)this.head=this.tail=n;else{this.tail.next=n;n.prev=this.tail;this.tail=n}return true}
 removeSong(id){const n=this.map.get(id);if(!n)return false;if(this.cursor===n)this.cursor=n.prev;
  if(n.prev)n.prev.next=n.next;else this.head=n.next;if(n.next)n.next.prev=n.prev;else this.tail=n.prev;this.map.delete(id);return true}
 next(){if(!this.head)return'end';if(!this.cursor){this.cursor=this.head;return this.cursor}
  if(this.cursor.next){this.cursor=this.cursor.next;return this.cursor}if(this.repeat){this.cursor=this.head;return this.cursor}return'end'}
 previous(){if(!this.head)return'start';if(this.cursor&&this.cursor.prev){this.cursor=this.cursor.prev;return this.cursor}
  if(this.repeat){this.cursor=this.tail;return this.cursor}return'start'}
 toggleRepeat(){return this.repeat=!this.repeat}
 ids(){const a=[];for(let n=this.head;n;n=n.next)a.push(n.id);return a}}
// Milestone 2: queue (linked) + stack (linked, keeps last 10)
class Queue{constructor(){this.h=null;this.t=null;this.n=0}
 enqueue(v){const x={v,next:null};if(this.t)this.t.next=x;else this.h=x;this.t=x;this.n++}
 dequeue(){if(!this.h)return null;const x=this.h;this.h=x.next;if(!this.h)this.t=null;this.n--;return x.v}
 toArray(){const a=[];for(let x=this.h;x;x=x.next)a.push(x.v);return a}}
class Stack{constructor(max){this.top=null;this.n=0;this.max=max}
 push(v){this.top={v,down:this.top};this.n++;if(this.n>this.max){let x=this.top;while(x.down.down)x=x.down;x.down=null;this.n--}}
 pop(){if(!this.top)return null;const v=this.top.v;this.top=this.top.down;this.n--;return v}
 toArray(){const a=[];for(let x=this.top;x;x=x.down)a.push(x.v);return a}}
// Milestone 3: BST keyed by lower-cased title + undirected graph
class BST{constructor(){this.root=null}
 addSong(title,id){const k=title.toLowerCase(),mk=()=>({k,title,ids:[id],l:null,r:null});if(!this.root){this.root=mk();return}
  let c=this.root;for(;;){if(k===c.k){if(!c.ids.includes(id))c.ids.push(id);return}const s=k<c.k?'l':'r';if(!c[s]){c[s]=mk();return}c=c[s]}}
 findSong(title){const k=title.toLowerCase();let c=this.root;while(c){if(k===c.k)return c.ids[0];c=k<c.k?c.l:c.r}return null}
 prefixSearch(p){const o=[];p=p.trim().toLowerCase();if(p)this._w(this.root,p,o);return o}
 _w(n,p,o){if(!n)return;const m=n.k.startsWith(p);if(m||p<n.k)this._w(n.l,p,o);if(m)o.push(n);if(m||p>n.k)this._w(n.r,p,o)}}
class Graph{constructor(){this.m=new Map()}
 addRelation(a,b){if(!a||!b||a===b)return false;for(const x of[a,b])if(!this.m.has(x))this.m.set(x,new Set());if(this.m.get(a).has(b))return false;this.m.get(a).add(b);this.m.get(b).add(a);return true}
 related(a){return[...(this.m.get(a)||[])].sort()}
 recommendArtists(a){const d=this.m.get(a);if(!d)return[];const r=new Set();for(const x of d)for(const y of this.m.get(x))if(y!==a&&!d.has(y))r.add(y);return[...r].sort()}
 via(a,t){return this.related(a).filter(x=>this.m.get(x).has(t))}}
// One engine = one source of truth for the whole app
class Engine{constructor(lib){this.lib=new Map();this.pl=new Playlist();this.q=new Queue();this.hist=new Stack(10);this.bst=new BST();this.g=new Graph();this.cur=null;
 lib.forEach(s=>{this.lib.set(s.id,s);this.bst.addSong(s.title,s.id)})}
 playNext(){let t;if(this.q.n)t=this.q.dequeue();else{const r=this.pl.next();if(r==='end')return'end';t=r.id}
  if(this.cur)this.hist.push(this.cur);this.cur=t;return t}
 back(){const h=this.hist.pop();if(!h)return'empty';this.cur=h;return h}
 playOffPlaylist(id){if(this.cur&&this.cur!==id)this.hist.push(this.cur);this.cur=id}
 playFromPlaylist(id){const n=this.pl.map.get(id);if(n)this.pl.cursor=n;this.playOffPlaylist(id)}
 step(dir){const r=dir>0?this.pl.next():this.pl.previous();if(typeof r==='string')return r;this.playOffPlaylist(r.id);return r.id}}
/*END CORE*/
const SONGS=[['S01','Midnight Velvet','Aurelia Voss'],['S02','Midnight Rain','Kairo Lane'],['S03','Golden Hour Waltz','Noor Solace'],['S04','Gilded Cage','Daxton Reed'],
['S05','Velvet Skyline','Mira Halden'],['S06','Crown of Embers','Orion Pike'],['S07','Crystal Tides','Sable Quinn'],['S08','Royal Static','Lysander Cole'],
['S09','Moonlit Avenue','Zara Monteil'],['S10','Marble Hearts','Eli Rowan'],['S11','Amber Nights','Aurelia Voss'],['S12','Silk and Thunder','Kairo Lane'],
['S13','Opal Dreams','Noor Solace'],['S14','Ivory Echoes','Mira Halden'],['S15','Crimson Lanterns','Orion Pike'],['S16','Gold Rush Lullaby','Daxton Reed']].map(([id,title,artist])=>({id,title,artist}));
const LINKS=[['Aurelia Voss','Kairo Lane'],['Kairo Lane','Noor Solace'],['Noor Solace','Daxton Reed'],['Aurelia Voss','Mira Halden'],['Mira Halden','Orion Pike'],['Orion Pike','Sable Quinn'],['Daxton Reed','Lysander Cole'],['Zara Monteil','Eli Rowan']];
const DUR=30;let E,view='home',artistSel='Aurelia Voss',searchQ='';
function seed(){E=new Engine(SONGS);LINKS.forEach(l=>E.g.addRelation(...l));['S01','S05','S06','S11','S14'].forEach(i=>E.pl.addSong(i));
 for(let i=0;i<4;i++)E.playNext();E.q.enqueue('S03');E.q.enqueue('S08')}
const $=s=>document.querySelector(s),S=id=>E.lib.get(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hue=id=>[...id].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const FILLED=new Set(['play','pause','next','prev']);

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const MODES=[{n:'Major',s:[0,2,4,5,7,9,11]},{n:'Minor',s:[0,2,3,5,7,8,10]},{n:'Dorian',s:[0,2,3,5,7,9,10]},{n:'Phrygian',s:[0,1,3,5,7,8,10]},{n:'Lydian',s:[0,2,4,6,7,9,11]},{n:'Mixolydian',s:[0,2,4,5,7,9,10]},{n:'Harmonic minor',s:[0,2,3,5,7,8,11]}];
const PROGS=[[0,4,5,3],[0,5,3,4],[0,3,4,3],[5,3,0,4],[0,2,5,4],[0,6,5,4],[1,4,0,0],[0,3,5,4]];
const KICKS=[[0,8],[0,6,8,14],[0,4,8,12],[0,3,8,11],[0,10]];
const NAMES=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
function profile(id){const r=rng(hash(id)),pick=a=>a[Math.floor(r()*a.length)];

 return{mode:mode.n,sc:mode.s,root,key:NAMES[root%12],bpm:68+Math.floor(r()*70),prog:pick(PROGS),pent:r()<.45,
  motif:Array.from({length:16},(_,i)=>r()<(i%4===0?.15:.45)?null:Math.floor(r()*7)-1),
  lead:pick(['triangle','sawtooth','square','sine','triangle']),bass:pick(['sine','triangle','sawtooth','square']),pad:pick(['sine','triangle','sawtooth']),
  cut:900+Math.floor(r()*3600),swing:r()<.4?.2:0,kick:pick(KICKS),hat:pick([1,2,4]),snare:r()<.8,drums:r()<.85,oct:r()<.3?12:0,arp:r()<.35,vib:r()<.45}}
let ac,master,delayN,noiseBuf,bus=null,playing=false,elapsed=0,tick=null,sched=null,silent=false,prof=null,pSong=null,stepI=0,nextT=0,lastTs=0;
const fr=m=>440*Math.pow(2,(m-69)/12);
const deg=(p,d,o=0)=>{const n=7,oct=Math.floor(d/n),i=((d%n)+n)%n;return p.root+12*(oct+o)+p.sc[i]};
const pdeg=d=>{const P=[0,1,2,4,5];return P[((d%5)+5)%5]+7*Math.floor(d/5)};
function voice(type,f,t,dur,vol,cut,vib){const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut;
 o.connect(fl);fl.connect(g);g.connect(bus.g);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.02,dur/4));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.5;lg.gain.value=14;l.connect(lg);lg.connect(o.detune);l.start(t);l.stop(t+dur+.05)}o.start(t);o.stop(t+dur+.05)}
function pad(type,f,t,dur,vol){const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=1100;o.connect(fl);fl.connect(g);g.connect(bus.g);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*.25);g.gain.linearRampToValueAtTime(0,t+dur);o.start(t);o.stop(t+dur+.05)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);o.connect(g);g.connect(bus.g);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.start(t);o.stop(t+.3)}

function schedStep(i,t){const p=prof,sd=60/p.bpm/4,bar=Math.floor(i/16),s=i%16,ch=p.prog[bar%4];
 if(s===0)[0,2,4].forEach(k=>pad(p.pad,fr(deg(p,ch+k,1)),t,sd*16,.07));
 if(s%4===0||(p.arp&&s%2===0))voice(p.bass,fr(deg(p,ch+(p.arp&&s%4?4:0),-1)),t,sd*(p.arp?1.6:3),.2,500,false);
 if(p.arp&&s%2===1)voice(p.lead,fr(deg(p,ch+[0,2,4,2][(s>>1)%4],1)+p.oct),t,sd*1.2,.05,p.cut,false);

function makeBus(){const g=ac.createGain(),send=ac.createGain();send.gain.value=.22;g.connect(master);g.connect(send);send.connect(delayN);bus={g,send};delayN.delayTime.value=60/prof.bpm*.75}

function initAudio(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=$('#vol')?$('#vol').value/100:.6;
 const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
 delayN=ac.createDelay(2);const fb=ac.createGain();fb.gain.value=.35;delayN.connect(fb);fb.connect(delayN);delayN.connect(master);
 noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}

 else if(e.target.id==='vol'){setPct(e.target);if(master)master.gain.value=e.target.value/100}});
document.addEventListener('change',e=>{if(e.target.id==='as'){artistSel=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)){e.preventDefault();toggle()}});
seed();render();
</script></body></html>
