<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReliefHub · Sindh flood relief</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c1a40;--ink2:#16275c;--gold:#c4a35a;--gold2:#e6d39d;--pearl:#eef0f5;--card:#fff;--tx:#18203a;--mu:#6a7087;--ln:#dfe2ec;--red:#a3263a;--amb:#a96a0c;--grn:#23694f;--blu:#2c4a9a;--serif:"Bodoni Moda",Georgia,serif;--sans:Figtree,system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--pearl);color:var(--tx);font:15px/1.5 var(--sans)}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0}
/* masthead */
.mast{background:var(--ink);color:#fff;border-bottom:3px double var(--gold);padding:14px 24px 0}
.mt{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crest{display:flex;align-items:center;gap:12px}.crest svg{width:34px;height:34px}
.crest b{font:700 26px var(--serif);letter-spacing:.5px}.crest small{display:block;color:var(--gold2);font-size:12px;margin-top:-4px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gold2)}
.who select{background:var(--ink2);color:#fff;border:1px solid var(--gold);border-radius:99px;padding:6px 12px}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px}
nav button{background:none;border:0;color:#b9c0dc;padding:12px 16px;font:600 14px var(--sans);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;margin:0;border-radius:0}
nav button:hover{color:#fff}nav .on{color:var(--gold2);border-color:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
/* hero */
.hero{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff;border-radius:18px;padding:34px 34px 0;border:1px solid var(--gold);box-shadow:0 18px 40px #0c1a4030;margin-bottom:26px}
.hero h2{font-size:clamp(26px,4.2vw,44px);line-height:1.15;max-width:820px}.hero h2 em{color:var(--gold2)}
.hero p{color:#b9c0dc;margin:10px 0 26px;max-width:640px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #c4a35a66}
.strip div{padding:18px 14px 20px;border-right:1px solid #c4a35a40}.strip div:last-child{border:0}
.strip b{display:block;font:500 clamp(28px,3.4vw,40px) var(--serif);color:var(--gold2)}.strip span{font-size:13px;color:#b9c0dc}
@media(max-width:760px){.strip{grid-template-columns:repeat(2,1fr)}.strip div{border-bottom:1px solid #c4a35a40}.hero{padding:22px 18px 0}}
/* generic */
.sec{margin:0 0 28px}.sec>header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--gold);padding-bottom:6px}
.sec>header h3{font-size:24px}.m{color:var(--mu);font-size:13px}.sp{flex:1}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;box-shadow:0 2px 10px #0c1a4010}
.two{display:grid;grid-template-columns:1fr 1.25fr;gap:20px}@media(max-width:860px){.two{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--ln);border-top:3px solid var(--gold);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card.closed{border-top-color:#b7bbc9;opacity:.75}.card h4{font:500 20px var(--serif);margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;gap:5px;align-items:center;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.g{color:var(--grn);background:#23694f14}.o{color:var(--amb);background:#a96a0c14}.r{color:var(--red);background:#a3263a14}.b{color:var(--blu);background:#2c4a9a14}.n{color:var(--mu);background:#6a708712}
.bar{height:7px;background:#e3e6f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px}
button:hover{background:#f3f4fa}button.pri{background:var(--ink);color:#fff}button.pri:hover{background:var(--ink2)}
button.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}button.d{color:var(--red);border-color:#a3263a66}button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,nav button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{padding:8px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--tx);max-width:100%}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
/* ledger rows */
.led{display:grid;gap:10px}.item{display:grid;grid-template-columns:1.4fr 1.2fr 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px}
.item.crit{border-left-color:var(--red)}.item.warn{border-left-color:var(--amb)}.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:860px){.item{grid-template-columns:1fr}.item .acts{justify-content:flex-start}}
.item b{font-weight:600}
/* chart */
.chart{display:flex;gap:12px;height:220px;align-items:stretch}.col{flex:1;display:flex;flex-direction:column;text-align:center;min-width:0}
.cb{flex:1;display:flex;align-items:flex-end;border-bottom:2px solid var(--gold);margin:4px 0}.cb i{width:100%;border-radius:8px 8px 0 0;display:block;min-height:2px}
.col span{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px;text-align:center;color:var(--mu);border:1px dashed var(--gold);border-radius:12px;background:#fff8}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}th{font-size:12px;color:var(--mu);font-weight:600}
.tw{overflow-x:auto}
dialog{border:1px solid var(--gold);border-radius:16px;padding:22px;width:min(440px,94vw);background:#fff;color:var(--tx)}dialog::backdrop{background:#0c1a4099}
dialog label{display:block;margin:10px 0;font-weight:600;font-size:13px}dialog input,dialog select{width:100%;margin-top:4px}
dialog .err{color:var(--red);font-size:13px;min-height:18px}.end{justify-content:flex-end;margin-top:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border:1px solid var(--gold);padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;z-index:9}#toast.show{opacity:1}
#toast.bad{background:var(--red)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="mast"><div class="mt"><div class="crest"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 36 10v10c0 9-7 15-16 18C11 35 4 29 4 20V10z" fill="none" stroke="#c4a35a" stroke-width="2"/><path d="M12 22c3-4 5 4 8 0s5 4 8 0M12 16c3-4 5 4 8 0s5 4 8 0" fill="none" stroke="#e6d39d" stroke-width="1.8"/></svg><div><b>ReliefHub</b><small>Sindh flood relief coordination</small></div></div>
<label class="who">Signed in as <select id="role" aria-label="Switch role" onchange="role=this.value;if(!isA()&&['inventory'].includes(tab))tab='dashboard';render()"><option value="admin">Relief Coordinator</option><option value="volunteer">Field Volunteer</option></select></label></div>
<nav id="nav" aria-label="Main"></nav></div>
<main id="main"><div class="empty">Loading relief data…</div></main><div id="toast" role="status" aria-live="polite"></div>
<script>
const COLS=['camps','inventory','needs','dispatches','donations','volunteers'];
const TABS=[['dashboard','Overview'],['camps','Camps'],['needs','Needs'],['inventory','Warehouse'],['dispatches','Dispatches'],['donations','Donations'],['volunteers','Volunteers']];
let role='admin',S={},tab='dashboard',F={q:'',st:'',camp:'',ds:'',vq:'',sk:'',va:'',cat:'',sg:'',iq:'',np:''},detail=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(m,u,b)=>{const r=await fetch('/api/'+u,{method:m,headers:{'Content-Type':'application/json','x-role':role},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({error:'Server returned an unreadable reply'}));if(!r.ok)throw new Error(d.error||'Request failed');return d};
const load=async()=>{await Promise.all(COLS.map(async c=>S[c]=await api('GET',c)));render()};
const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3600)};
const act=async(f,ok)=>{try{await f();await load();ok&&toast(ok)}catch(e){toast(e.message,true);load().catch(()=>{})}};
const by=(c,id)=>S[c].find(x=>x.id==id)||{},sum=(a,k)=>a.reduce((s,x)=>s+x[k],0),isA=()=>role==='admin';
const resQ=n=>sum(S.dispatches.filter(d=>d.need_id==n.id&&['Pending','In Transit'].includes(d.status)),'quantity');
const pct=n=>n.required_quantity?Math.round(n.fulfilled_quantity/n.required_quantity*100):0,isLow=i=>i.stock<=i.reorder_level;
const rem=n=>n.required_quantity-n.fulfilled_quantity-resQ(n),crit=n=>n.priority==='High'&&pct(n)<40,W={High:3,Medium:2,Low:1};
const TC={Active:'g',Full:'o',Closed:'n',Pending:'o','In Transit':'b',Delivered:'g',Cancelled:'n',High:'r',Medium:'o',Low:'n','Low Stock':'r','In stock':'g',Cash:'b','In-Kind':'g',Assigned:'g',Available:'o','Critical gap':'r'};
const tag=t=>`<span class="tag ${TC[t]||'n'}">${esc(t)}</span>`;
const col=p=>p<40?'var(--red)':p<75?'var(--amb)':'var(--grn)';
const bar=(p,c)=>`<div class="bar" role="img" aria-label="${Math.round(p)} percent"><i style="width:${Math.min(Math.max(p,0),100)}%;background:${c||col(p)}"></i></div>`;
const opts=(arr,v)=>arr.map(o=>{o=Array.isArray(o)?o:[o,o];return `<option value="${esc(o[0])}"${o[0]==v?' selected':''}>${esc(o[1])}</option>`}).join('');
const go=(t,camp)=>{tab=t;detail=null;if(camp)F.camp=camp;render();scrollTo(0,0)};
const del=(c,id)=>confirm('Delete this record? This cannot be undone.')&&act(()=>api('DELETE',c+'/'+id),'Deleted');
const empty=m=>`<div class="empty">${m}</div>`;
function modal(title,fields,fn,label){const d=document.createElement('dialog');
 d.innerHTML=`<form><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${opts(f.o,f.v)}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.min!=null?`min="${f.min}"`:''} ${f.t=='number'?'step="1" required':''}>`}</label>`).join('')}<div class="err" role="alert"></div><div class="row end"><button type="button" class="x">Cancel</button><button class="pri">${label||'Save'}</button></div></form>`;
 document.body.append(d);d.showModal();d.onclose=()=>d.remove();d.querySelector('.x').onclick=()=>d.close();
 d.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=d.querySelector('.pri');if(b.disabled)return;b.disabled=true;b.textContent='Saving…';
  try{await fn(Object.fromEntries(new FormData(e.target)));d.close();await load();toast('Saved')}catch(x){d.querySelector('.err').textContent=x.message;b.disabled=false;b.textContent=label||'Save'}}}

/* ---------- Overview ---------- */
const quickSend=(id,q)=>act(()=>api('POST','dispatches',{camp_id:by('needs',id).camp_id,need_id:id,quantity:q}),'Dispatch created, stock reserved');
function vDash(){const live=S.camps.filter(c=>c.status!=='Closed'),N=S.needs,rq=sum(N,'required_quantity'),fl=sum(N,'fulfilled_quantity'),gaps=N.filter(crit).sort((a,b)=>pct(a)-pct(b)),low=S.inventory.filter(isLow);
 const cats=[...new Set(S.inventory.map(i=>i.category))].map(c=>{const ns=N.filter(n=>by('inventory',n.inventory_item_id).category===c),r=sum(ns,'required_quantity');return[c,r?Math.round(sum(ns,'fulfilled_quantity')/r*100):0,r]});
 const camps=[...new Set(gaps.map(n=>n.camp_id))].length;
 const K=(v,l)=>`<div><b>${v}</b><span>${l}</span></div>`;
 const urgent=live.map(c=>{const ns=N.filter(n=>n.camp_id==c.id&&rem(n)>0);const score=Math.round(ns.reduce((s,n)=>s+W[n.priority]*(1-pct(n)/100),0)*10)/10;
  const pick=ns.filter(n=>by('inventory',n.inventory_item_id).stock>0).sort((a,b)=>W[b.priority]-W[a.priority]||pct(a)-pct(b))[0];return{c,score,pick}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,4);
 const pend=S.dispatches.filter(d=>['Pending','In Transit'].includes(d.status));
 return `<section class="hero"><h2>${gaps.length?`<em>${gaps.length} critical ${gaps.length>1?'gaps':'gap'}</em> across ${camps} ${camps>1?'camps':'camp'} need supplies today.`:'Every high-priority need is on track.'}</h2>
 <p>${low.length?`${low.length} warehouse ${low.length>1?'items are':'item is'} at or below reorder level. `:''}${pend.length} dispatch${pend.length==1?'':'es'} currently on the way.</p>
 <div class="strip">${K(live.length,'Active camps')}${K(sum(live,'current_families').toLocaleString(),'Families sheltered')}${K((rq?Math.round(fl/rq*100):0)+'%','Demand fulfilled')}${K(low.length,'Low-stock items')}${K(S.volunteers.filter(v=>v.camp_id).length,'Volunteers deployed')}</div></section>
 <div class="two sec"><div><header style="display:flex;border-bottom:1px solid var(--gold);padding-bottom:6px;margin-bottom:12px"><h3 style="font-size:24px">Fulfilment by category</h3></header><div class="panel"><div class="chart" role="img" aria-label="Fulfilment: ${cats.map(c=>c[0]+' '+c[1]+'%').join(', ')}">${cats.map(([c,p,r])=>`<div class="col" title="${esc(c)}: ${p}% of ${r.toLocaleString()} units required"><b>${p}%</b><div class="cb"><i style="height:${p}%;background:${col(p)}"></i></div><span>${esc(c)}</span></div>`).join('')}</div></div></div>
 <div><header style="display:flex;border-bottom:1px solid var(--gold);padding-bottom:6px;margin-bottom:12px"><h3 style="font-size:24px">Camps to help first</h3></header><div class="led">${urgent.map(x=>{const n=x.pick,i=n&&by('inventory',n.inventory_item_id),q=n&&Math.min(rem(n),i.stock);
  return `<div class="item" style="grid-template-columns:1fr auto"><div><b>${esc(x.c.name)}</b><div class="m">${esc(x.c.district)} · urgency ${x.score}</div></div>${n&&isA()?`<button class="gold" onclick="quickSend(${n.id},${q})">Send ${q} ${esc(i.unit)} ${esc(i.name)}</button>`:`<button onclick="detail=${x.c.id};go('camps')">Open camp</button>`}</div>`}).join('')||empty('Every camp is fully supplied.')}</div></div></div>
 <section class="sec"><header><h3>Critical gaps</h3><span class="m">High priority, under 40% fulfilled, worst first</span></header><div class="led">${gaps.map(n=>{const i=by('inventory',n.inventory_item_id),c=by('camps',n.camp_id),short=i.stock<rem(n);
  return `<div class="item crit"><div><b>${esc(c.name)}</b><div class="m">${esc(c.district)}</div></div><div>${esc(i.name)}<div class="m">${n.fulfilled_quantity.toLocaleString()} of ${n.required_quantity.toLocaleString()} ${esc(i.unit)} · ${rem(n).toLocaleString()} still unreserved</div>${short?`<span class="tag r">Warehouse short by ${(rem(n)-i.stock).toLocaleString()}</span>`:''}</div><div><b>${pct(n)}%</b>${bar(pct(n))}</div><div class="acts"><button onclick="detail=${c.id};go('camps')">Open camp</button>${isA()?(short?`<button class="gold" onclick="go('donations')">Restock</button>`:`<button class="pri" onclick="newDisp(${n.id})">Dispatch</button>`):''}</div></div>`}).join('')||empty('No critical gaps right now. High-priority needs are all at 40% or better.')}</div></section>
 <section class="sec"><header><h3>Low stock</h3></header><div class="led">${low.map(i=>`<div class="item warn" style="grid-template-columns:1fr auto auto"><b>${esc(i.name)}</b><span>${i.stock.toLocaleString()} ${esc(i.unit)} <span class="m">(reorder at ${i.reorder_level})</span></span>${tag('Low Stock')}</div>`).join('')||empty('All items are above their reorder level.')}</div></section>`}

/* ---------- Camps ---------- */
function vCamps(){if(detail)return vCamp(detail);const q=F.q.toLowerCase(),L=S.camps.filter(c=>(!q||(c.name+' '+c.district).toLowerCase().includes(q))&&(!F.st||c.status===F.st));
 return `<div class="tools"><input id="fq" placeholder="Search name or district" aria-label="Search camps" value="${esc(F.q)}" oninput="F.q=this.value;render()"><select id="fst" aria-label="Status" onchange="F.st=this.value;render()">${opts([['','All statuses'],'Active','Full','Closed'],F.st)}</select><button onclick="F.q='';F.st='';render()">Reset</button><span class="sp"></span>${isA()?'<button class="pri" onclick="editCamp()">+ Add camp</button>':''}</div>
 <div class="cards">${L.map(c=>{const p=c.current_families/c.capacity*100,ns=S.needs.filter(n=>n.camp_id==c.id),g=ns.filter(crit).length;
 return `<div class="card ${c.status==='Closed'?'closed':''}"><div class="row"><h4>${esc(c.name)}</h4><span class="sp"></span>${tag(c.status)}</div><div class="m">${esc(c.district)} district</div>
 <div>${c.current_families} of ${c.capacity} families</div>${bar(p,'var(--blu)')}<div class="m">${c.capacity-c.current_families} places free${g?` · <b style="color:var(--red)">${g} critical gap${g>1?'s':''}</b>`:''}</div>
 <div class="row"><button class="pri" onclick="detail=${c.id};render()">View camp</button><button onclick="editCamp(${c.id})">${isA()?'Edit':'Update families'}</button>${isA()?`<button class="d" onclick="del('camps',${c.id})">Delete</button>`:''}</div></div>`}).join('')}</div>${L.length?'':empty('No camps match. Reset the filters or add a camp.')}`}
function vCamp(id){const c=by('camps',id),ns=S.needs.filter(n=>n.camp_id==id),ds=S.dispatches.filter(d=>d.camp_id==id&&['Pending','In Transit'].includes(d.status)),vs=S.volunteers.filter(v=>v.camp_id==id);
 return `<div class="tools"><button onclick="detail=null;render()">‹ All camps</button><span class="sp"></span>${isA()?`<button onclick="editCamp(${id})">Edit</button>`:`<button onclick="editCamp(${id})">Update families</button>`}</div>
 <section class="hero" style="padding-bottom:22px"><div class="row">${tag(c.status)}<span class="m" style="color:#b9c0dc">${esc(c.district)} district</span></div><h2>${esc(c.name)}</h2><p>${c.current_families} of ${c.capacity} families sheltered · ${c.capacity-c.current_families} places free</p></section>
 <section class="sec"><header><h3>Needs</h3>${isA()?`<span class="sp"></span><button class="pri" onclick="F.camp=${id};editNeed()">+ Add need</button>`:''}</header><div class="led">${ns.map(needRow).join('')||empty('No needs recorded for this camp yet.')}</div></section>
 <div class="two"><section><header class="sec" style="margin:0 0 10px"><h3 style="font-size:22px">On the way</h3></header><div class="led">${ds.map(d=>{const n=by('needs',d.need_id),i=by('inventory',n.inventory_item_id);return `<div class="item" style="grid-template-columns:1fr auto">${d.quantity} ${esc(i.unit)} ${esc(i.name)}${tag(d.status)}</div>`}).join('')||empty('No active dispatches.')}</div></section>
 <section><header class="sec" style="margin:0 0 10px"><h3 style="font-size:22px">Volunteers</h3></header><div class="led">${vs.map(v=>`<div class="item" style="grid-template-columns:1fr auto"><b>${esc(v.name)}</b><span class="m">${v.skill}</span></div>`).join('')||empty('No volunteers assigned.')}</div></section></div>`}
function editCamp(id){const c=id?by('camps',id):{};
 const f=isA()?[{k:'name',l:'Camp name',v:c.name},{k:'district',l:'District',v:c.district},{k:'capacity',l:'Capacity (families)',t:'number',min:1,v:c.capacity},{k:'current_families',l:'Current families',t:'number',min:0,v:c.current_families??0},{k:'status',l:'Status (Full is set automatically)',o:['Active','Closed'],v:c.status==='Closed'?'Closed':'Active'}]:[{k:'current_families',l:'Families now in '+c.name,t:'number',min:0,v:c.current_families}];
 modal(id?'Edit camp':'Add camp',f,o=>id?api('PATCH','camps/'+id,o):api('POST','camps',o))}

/* ---------- Needs ---------- */
function needRow(n){const i=by('inventory',n.inventory_item_id),p=pct(n),r=resQ(n),c=by('camps',n.camp_id);
 const st=p>=100?'Delivered':crit(n)?'Critical gap':null;
 return `<div class="item ${crit(n)?'crit':''}"><div><b>${esc(i.name)}</b><div class="m">${esc(c.name)}</div></div><div>${n.fulfilled_quantity.toLocaleString()} of ${n.required_quantity.toLocaleString()} ${esc(i.unit)} — ${p}%${r?`<div class="m">+${r} on the way</div>`:''}${bar(p)}</div><div class="row">${tag(n.priority)}${p>=100?'<span class="tag g">Fully met</span>':crit(n)?tag('Critical gap'):''}</div><div class="acts">${rem(n)>0?`<button onclick="newDisp(${n.id})">Dispatch</button>`:''}${isA()?`<button onclick="editNeed(${n.id})">Edit</button><button class="d" onclick="del('needs',${n.id})">Remove</button>`:''}</div></div>`}
function vNeeds(){const L=S.needs.filter(n=>(!F.camp||n.camp_id==F.camp)&&(!F.np||n.priority===F.np)&&(!F.sg||(F.sg==='crit'?crit(n):F.sg==='open'?pct(n)<100:pct(n)>=100)));
 return `<div class="tools"><select id="fc" aria-label="Camp" onchange="F.camp=this.value;render()"><option value="">All camps</option>${opts(S.camps.map(c=>[c.id,c.name]),F.camp)}</select><select aria-label="Priority" onchange="F.np=this.value;render()">${opts([['','Any priority'],'High','Medium','Low'],F.np)}</select><select aria-label="Progress" onchange="F.sg=this.value;render()">${opts([['','Any progress'],['crit','Critical gaps'],['open','Not fully met'],['done','Fully met']],F.sg)}</select><button onclick="F.camp=F.np=F.sg='';render()">Reset</button><span class="sp"></span>${isA()?'<button class="pri" onclick="editNeed()">+ Add need</button>':''}</div>
 <div class="led">${L.map(needRow).join('')||empty('No needs match these filters.')}</div>`}
function editNeed(id){const n=id?by('needs',id):{};
 modal(id?'Edit need':'Add need',[{k:'camp_id',l:'Camp',o:S.camps.filter(c=>c.status!=='Closed').map(c=>[c.id,c.name]),v:n.camp_id||F.camp},{k:'inventory_item_id',l:'Item',o:S.inventory.map(i=>[i.id,i.name+' ('+i.unit+')']),v:n.inventory_item_id},{k:'required_quantity',l:'Required quantity',t:'number',min:1,v:n.required_quantity},{k:'priority',l:'Priority',o:['High','Medium','Low'],v:n.priority||'Medium'}],o=>id?api('PATCH','needs/'+id,o):api('POST','needs',o))}

/* ---------- Warehouse ---------- */
function vInv(){const q=F.iq.toLowerCase(),L=S.inventory.filter(i=>(!q||i.name.toLowerCase().includes(q))&&(!F.cat||i.category===F.cat)&&(!F.sg||(F.sg==='low'?isLow(i):!isLow(i))));
 return `<div class="tools"><input aria-label="Search items" placeholder="Search items" value="${esc(F.iq)}" id="fiq" oninput="F.iq=this.value;render()"><select aria-label="Category" onchange="F.cat=this.value;render()">${opts([['','All categories'],...[...new Set(S.inventory.map(i=>i.category))]],F.cat)}</select><select aria-label="Stock" onchange="F.sg=this.value;render()">${opts([['','Any stock level'],['low','Low stock'],['ok','Healthy']],F.sg)}</select><button onclick="F.iq=F.cat=F.sg='';render()">Reset</button><span class="sp"></span>${isA()?'<button class="pri" onclick="editItem()">+ Add item</button>':''}</div>
 <div class="panel tw"><table><tr><th>Item<th>Category<th>Stock<th>Reorder level<th>Status<th></tr>${L.map(i=>`<tr><td><b>${esc(i.name)}</b><td>${esc(i.category)}<td>${i.stock.toLocaleString()} ${esc(i.unit)}<td>${i.reorder_level.toLocaleString()}<td>${tag(isLow(i)?'Low Stock':'In stock')}<td>${isA()?`<button onclick="editItem(${i.id})">Edit</button> <button class="d" onclick="del('inventory',${i.id})">Delete</button>`:''}</tr>`).join('')||`<tr><td colspan=6>${empty('No items match.')}</tr>`}</table></div>`}
function editItem(id){const i=id?by('inventory',id):{};
 modal(id?'Edit item':'Add item',[{k:'name',l:'Item name',v:i.name},{k:'category',l:'Category (Food, Water, Medicine…)',v:i.category},{k:'unit',l:'Unit (kg, litre, kits…)',v:i.unit},{k:'stock',l:'Stock',t:'number',min:0,v:i.stock??0},{k:'reorder_level',l:'Reorder level',t:'number',min:0,v:i.reorder_level??0}],o=>id?api('PATCH','inventory/'+id,o):api('POST','inventory',o))}

/* ---------- Dispatches ---------- */
function newDisp(needId){const L=S.needs.map(n=>({n,i:by('inventory',n.inventory_item_id),c:by('camps',n.camp_id),r:rem(n)})).filter(x=>x.r>0&&x.c.status!=='Closed');
 if(!L.length)return toast('No needs have unreserved quantity left',true);const pick=L.find(x=>x.n.id==needId)||L[0];
 modal('New dispatch',[{k:'need_id',l:'Camp and need',o:L.map(x=>[x.n.id,`${x.c.name}: ${x.i.name} (${x.r} needed, ${x.i.stock} in stock)`]),v:pick.n.id},{k:'quantity',l:'Quantity (up to stock and unreserved need)',t:'number',min:1,v:Math.max(1,Math.min(pick.r,pick.i.stock))}],o=>api('POST','dispatches',{camp_id:by('needs',o.need_id).camp_id,need_id:o.need_id,quantity:o.quantity}),'Reserve and dispatch')}
const setD=(id,s)=>act(()=>api('PATCH','dispatches/'+id,{status:s}),'Dispatch marked '+s);
function vDisp(){const L=S.dispatches.filter(d=>!F.ds||d.status===F.ds).slice().reverse();
 return `<div class="tools"><select aria-label="Status" onchange="F.ds=this.value;render()">${opts([['','All statuses'],'Pending','In Transit','Delivered','Cancelled'],F.ds)}</select><span class="sp"></span>${isA()?'<button class="pri" onclick="newDisp()">+ New dispatch</button>':''}</div>
 <div class="led">${L.map(d=>{const n=by('needs',d.need_id),i=by('inventory',n.inventory_item_id);return `<div class="item ${d.status==='Pending'?'warn':''}" style="grid-template-columns:50px 1.5fr 1fr auto auto"><span class="m">#${d.id}</span><div><b>${esc(by('camps',d.camp_id).name||'(camp removed)')}</b></div><div>${d.quantity} ${esc(i.unit||'')} ${esc(i.name||'')}</div>${tag(d.status)}<div class="acts">${isA()?`${d.status==='Pending'?`<button onclick="setD(${d.id},'In Transit')">Mark in transit</button>`:''}${d.status==='In Transit'?`<button class="pri" onclick="setD(${d.id},'Delivered')">Mark delivered</button>`:''}${['Pending','In Transit'].includes(d.status)?`<button class="d" onclick="setD(${d.id},'Cancelled')">Cancel</button>`:''}`:''}</div></div>`}).join('')||empty('No dispatches with this status.')}</div>`}

/* ---------- Donations ---------- */
function vDon(){const D=S.donations,cash=D.filter(d=>d.type==='Cash'),cats=[...new Set(D.map(d=>d.category))];
 return `<div class="hero" style="padding-bottom:0"><h2>PKR ${sum(cash,'amount_or_quantity').toLocaleString()} <em>received in cash</em></h2><p>${D.length} donations recorded, ${D.length-cash.length} of them in-kind goods that were added to warehouse stock.</p></div>
 ${isA()?'<div class="tools"><button class="pri" onclick="addDon(\'Cash\')">+ Cash donation</button><button class="gold" onclick="addDon(\'In-Kind\')">+ In-kind donation</button></div>':''}
 <div class="cards sec">${cats.map(c=>{const x=D.filter(d=>d.category===c);return `<div class="card"><h4>${esc(c)}</h4><div>Cash: PKR ${sum(x.filter(d=>d.type==='Cash'),'amount_or_quantity').toLocaleString()}</div><div class="m">In-kind: ${sum(x.filter(d=>d.type==='In-Kind'),'amount_or_quantity').toLocaleString()} units</div></div>`}).join('')}</div>
 <div class="panel tw"><table><tr><th>#<th>Donor<th>Type<th>Category<th>Gift</tr>${D.slice().reverse().map(d=>`<tr><td>${d.id}<td>${esc(d.donor)}<td>${tag(d.type)}<td>${esc(d.category)}<td>${d.type==='Cash'?'PKR '+d.amount_or_quantity.toLocaleString():d.amount_or_quantity+' × '+esc(by('inventory',d.item_id).name)}</tr>`).join('')}</table></div>`}
function addDon(type){modal(type+' donation',[{k:'donor',l:'Donor name (optional)',v:''},type==='Cash'?{k:'category',l:'Category',o:['Food','Water','Medicine','Shelter','Hygiene','General'],v:'Food'}:{k:'item_id',l:'Item (stock will increase)',o:S.inventory.map(i=>[i.id,i.name]),v:S.inventory[0].id},{k:'amount_or_quantity',l:type==='Cash'?'Amount (PKR)':'Quantity',t:'number',min:1,v:''}],o=>api('POST','donations',{...o,type}),'Record donation')}

/* ---------- Volunteers ---------- */
const SK=['Medical','Logistics','Cooking','Driving','Counselling'];
function vVol(){const q=F.vq.toLowerCase(),L=S.volunteers.filter(v=>(!q||v.name.toLowerCase().includes(q))&&(!F.sk||v.skill===F.sk)&&(!F.va||(F.va==='a'?v.camp_id:!v.camp_id))),open=S.camps.filter(c=>c.status!=='Closed');
 return `<div class="tools"><input id="fvq" aria-label="Search volunteers" placeholder="Search volunteers" value="${esc(F.vq)}" oninput="F.vq=this.value;render()"><select aria-label="Skill" onchange="F.sk=this.value;render()">${opts([['','All skills'],...SK],F.sk)}</select><select aria-label="Assignment" onchange="F.va=this.value;render()">${opts([['','Everyone'],['a','Assigned'],['u','Available']],F.va)}</select><button onclick="F.vq=F.sk=F.va='';render()">Reset</button><span class="sp"></span>${isA()?'<button class="pri" onclick="addVol()">+ Register volunteer</button>':''}</div>
 <div class="cards">${L.map(v=>`<div class="card"><div class="row"><h4>${esc(v.name)}</h4><span class="sp"></span>${tag(v.camp_id?'Assigned':'Available')}</div><div class="m">${v.skill}</div>${isA()?`<label class="m">Camp<br><select aria-label="Assign ${esc(v.name)}" style="width:100%" onchange="act(()=>api('PATCH','volunteers/${v.id}',{camp_id:this.value}),'Assignment updated')"><option value="">Unassigned</option>${opts(open.map(c=>[c.id,c.name+(c.status==='Full'?' (Full)':'')]),v.camp_id)}</select></label><div class="row"><button onclick="editVol(${v.id})">Edit</button><button class="d" onclick="del('volunteers',${v.id})">Remove</button></div>`:`<div>${v.camp_id?esc(by('camps',v.camp_id).name):'Not assigned to a camp'}</div>`}</div>`).join('')}</div>${L.length?'':empty('No volunteers match.')}`}
const addVol=()=>modal('Register volunteer',[{k:'name',l:'Full name',v:''},{k:'skill',l:'Skill',o:SK,v:'Medical'}],o=>api('POST','volunteers',o));
const editVol=id=>{const v=by('volunteers',id);modal('Edit volunteer',[{k:'name',l:'Full name',v:v.name},{k:'skill',l:'Skill',o:SK,v:v.skill}],o=>api('PATCH','volunteers/'+id,o))};

/* ---------- shell ---------- */
function render(){const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart,tabs=TABS.filter(t=>isA()||t[0]!=='inventory');
 $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${k==tab?'on':''}" ${k==tab?'aria-current="page"':''} onclick="go('${k}')">${l}</button>`).join('');
 $('#main').innerHTML=({dashboard:vDash,camps:vCamps,needs:vNeeds,inventory:vInv,dispatches:vDisp,donations:vDon,volunteers:vVol})[tab]();
 if(id){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch{}}}}
load().catch(e=>$('#main').innerHTML=`<div class="empty">Cannot reach the relief server. Start it with <b>node server.js</b>, then open http://localhost:3001.<br><span class="m">${esc(e.message)}</span><br><br><button class="pri" onclick="location.reload()">Try again</button></div>`);
</script></body></html>
