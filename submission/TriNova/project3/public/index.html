<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relief Camp Manager</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu">&#9776;</button>
    <div class="brand">Relief Camp Manager</div>
    <label class="role-switch">
      <span>Role</span>
      <select id="roleSelect" aria-label="Switch role">
        <option value="admin">Relief Coordinator</option>
        <option value="volunteer">Field Volunteer</option>
      </select>
    </label>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Main menu"></nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/js/logic.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/views/camps.js"></script>
    <script src="/js/views/lists.js"></script>
  <script src="/js/views/work.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
