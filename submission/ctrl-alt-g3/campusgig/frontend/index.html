<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SkillSwap — Campus Gig & Skill Exchange Portal</title>
    <meta
      name="description"
      content="Trade skills, find short-term help and build a verified reputation on your campus. Programming, design, writing and tutoring gigs."
    />
    <meta name="theme-color" content="#f3f0e8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Manrope:wght@400..700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f0e8;
        --sf: #faf8f3;
        --tx: #141413;
        --mu: #6a675f;
        --bd: #d9d4c7;
        --ac: #1d3bff;
        --ac2: #141413;
        --ok: #0f7a55;
        --wn: #9a6a00;
        --er: #c4272f;
        --sh: none;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--sf);
        border-bottom: 1px solid var(--bd);
      }
      .bar {
        max-width: 1100px;
        margin: auto;
        padding: 12px 16px;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      .logo {
        font-weight: 800;
        font-size: 18px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .logo i {
        font-style: normal;
        background: linear-gradient(135deg, var(--ac), var(--ac2));
        color: #fff;
        border-radius: 10px;
        padding: 2px 8px;
      }
      nav {
        display: flex;
        gap: 4px;
        flex: 1;
        flex-wrap: wrap;
      }
      nav button {
        background: none;
        border: 0;
        color: var(--mu);
        font: inherit;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      nav button.on,
      nav button:hover {
        background: var(--bg);
        color: var(--ac);
      }
      select,
      input,
      textarea {
        font: inherit;
        color: var(--tx);
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 9px 11px;
        width: 100%;
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: 2px solid var(--ac);
        border-color: transparent;
      }
      .who {
        width: auto;
        max-width: 190px;
      }
      .btn {
        background: var(--ac);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 9px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .btn.sec {
        background: var(--bg);
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      .btn.ok {
        background: var(--ok);
      }
      .btn.er {
        background: var(--er);
      }
      .btn.sm {
        padding: 5px 11px;
        font-size: 13px;
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: 20px 16px 60px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--mu);
        margin: 0 0 16px;
      }
      .filters {
        display: grid;
        grid-template-columns: 2fr repeat(3, 1fr) 1fr 1fr;
        gap: 10px;
        margin-bottom: 18px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 16px;
        box-shadow: var(--sh);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: transform 0.15s;
      }
      .card:hover {
        transform: translateY(-3px);
      }
      .card h3 {
        margin: 0;
        font-size: 16px;
      }
      .card p {
        margin: 0;
        color: var(--mu);
        font-size: 13.5px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .b {
        font-size: 11.5px;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 99px;
        background: var(--bg);
        color: var(--mu);
        border: 1px solid var(--bd);
      }
      .b.Offering {
        color: var(--ok);
      }
      .b.Requesting {
        color: var(--ac2);
      }
      .b.Open {
        color: var(--ok);
      }
      .b.In-Progress {
        color: var(--wn);
      }
      .b.Completed {
        color: var(--ac);
      }
      .b.Expired,
      .b.Cancelled,
      .b.Rejected {
        color: var(--er);
      }
      .b.Accepted {
        color: var(--ok);
      }
      .b.Pending {
        color: var(--wn);
      }
      .meta {
        display: flex;
        gap: 12px;
        font-size: 12.5px;
        color: var(--mu);
        flex-wrap: wrap;
      }
      .meta b {
        color: var(--tx);
      }
      .own {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        border-top: 1px solid var(--bd);
        padding-top: 8px;
        margin-top: auto;
      }
      .av {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--ac), var(--ac2));
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        flex: none;
      }
      .av.lg {
        width: 64px;
        height: 64px;
        font-size: 24px;
      }
      .star {
        color: #f5a623;
        font-weight: 700;
      }
      .empty {
        text-align: center;
        color: var(--mu);
        padding: 50px 0;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(10, 8, 25, 0.55);
        display: none;
        align-items: flex-start;
        justify-content: center;
        overflow: auto;
        z-index: 20;
        padding: 24px 12px;
      }
      .modal.on {
        display: flex;
      }
      .panel {
        background: var(--sf);
        border-radius: 18px;
        width: 100%;
        max-width: 640px;
        padding: 22px;
        box-shadow: var(--sh);
        position: relative;
      }
      .x {
        position: absolute;
        right: 14px;
        top: 12px;
        background: none;
        border: 0;
        font-size: 24px;
        color: var(--mu);
        cursor: pointer;
      }
      .sec-t {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--mu);
        margin: 18px 0 8px;
      }
      .item {
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      .f {
        margin-bottom: 12px;
      }
      .f label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .err {
        color: var(--er);
        font-size: 12.5px;
        min-height: 0;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 14px 0;
      }
      .stat {
        background: var(--bg);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
      }
      .stat b {
        display: block;
        font-size: 22px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--tx);
        color: var(--bg);
        padding: 10px 18px;
        border-radius: 12px;
        z-index: 50;
        display: none;
        font-weight: 600;
      }
      @media (max-width: 800px) {
        .filters {
          grid-template-columns: 1fr 1fr;
        }
        .filters input:first-child {
          grid-column: 1/-1;
        }
        .two {
          grid-template-columns: 1fr;
        }
      }
      .hero {
        padding: 54px 0 20px;
        position: relative;
      }
      .hero h1 {
        font-size: clamp(38px, 7vw, 80px);
        line-height: 1.02;
        letter-spacing: -0.035em;
        margin: 14px 0 18px;
        max-width: 900px;
      }
      .hero h1 em {
        font-style: normal;
        background: linear-gradient(90deg, var(--ac), var(--ac2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .lead {
        font-size: 18px;
        color: var(--mu);
        max-width: 560px;
        margin: 0 0 24px;
      }
      .orb {
        position: absolute;
        right: -40px;
        top: 0;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 30% 30%, var(--ac), transparent 65%),
          radial-gradient(circle at 70% 70%, var(--ac2), transparent 60%);
        filter: blur(50px);
        opacity: 0.4;
        animation: fl 9s ease-in-out infinite;
        pointer-events: none;
        z-index: -1;
      }
      @keyframes fl {
        50% {
          transform: translateY(34px) scale(1.1);
        }
      }
      .btn {
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(109, 74, 255, 0.35);
      }
      .btn.lg {
        padding: 14px 26px;
        font-size: 16px;
        border-radius: 14px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 22px 0;
      }
      .chip {
        background: var(--sf);
        border: 1px solid var(--bd);
        color: var(--tx);
        border-radius: 99px;
        padding: 8px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s;
      }
      .chip:hover {
        border-color: var(--ac);
        color: var(--ac);
        transform: translateY(-2px);
      }
      .nums {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin: 34px 0;
      }
      .num {
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--sh);
      }
      .num b {
        font-size: 38px;
        display: block;
        letter-spacing: -0.03em;
      }
      .num span {
        color: var(--mu);
        font-size: 13px;
      }
      .mq {
        overflow: hidden;
        white-space: nowrap;
        border-block: 1px solid var(--bd);
        padding: 14px 0;
        margin: 30px 0;
        color: var(--mu);
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      .mq span {
        display: inline-block;
        animation: mq 135s linear infinite;
      }
      @keyframes mq {
        to {
          transform: translateX(-50%);
        }
      }
      .h2 {
        font-size: 30px;
        letter-spacing: -0.02em;
        margin: 46px 0 16px;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .step {
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 18px;
        padding: 20px;
      }
      .step i {
        font-style: normal;
        font-size: 12px;
        font-weight: 800;
        color: var(--ac);
        letter-spacing: 0.1em;
      }
      .step h3 {
        margin: 6px 0;
      }
      .step p {
        margin: 0;
        color: var(--mu);
      }
      .rk {
        display: flex;
        gap: 12px;
        align-items: center;
        cursor: pointer;
        transition: 0.15s;
      }
      .rk:hover {
        border-color: var(--ac);
      }
      .rv {
        opacity: 0;
        transform: translateY(26px);
        transition:
          opacity 0.7s,
          transform 0.7s;
      }
      .rv.in {
        opacity: 1;
        transform: none;
      }
      .foot {
        margin-top: 60px;
        padding-top: 20px;
        border-top: 1px solid var(--bd);
        color: var(--mu);
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }
      .panel {
        animation: pop 0.25s;
      }
      @keyframes pop {
        from {
          transform: translateY(14px);
          opacity: 0;
        }
      }
      .tg {
        background: none;
        border: 1px solid var(--bd);
        color: var(--tx);
        border-radius: 10px;
        width: 38px;
        height: 38px;
        cursor: pointer;
        font-size: 16px;
      }
      @media (max-width: 800px) {
        .nums {
          grid-template-columns: 1fr 1fr;
        }
        .steps {
          grid-template-columns: 1fr;
        }
        .orb {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        .rv {
          opacity: 1;
          transform: none;
        }
      }
      /* editorial flat theme: no gradients, no glow */
      body {
        font-family:
          "DM Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      h1,
      .h2 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: 38px;

      }
      .hero {
        padding: 70px 0 24px;
      }
      .hero h1 {
        font-size: clamp(48px, 9.5vw, 116px);
        line-height: 0.94;
        letter-spacing: -0.035em;
        max-width: 1000px;
      }
      .hero h1 em {
        background: none;
        -webkit-background-clip: initial;
        background-clip: initial;
        color: var(--ac);

      }
      .orb {
        display: none;
      }
      .lead {

      }
      .mono,

      .num span,
      .step i,
      .foot {
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      .mono {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--mu);
      }
      .b {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-radius: 3px;
        background: transparent;
        border: 1px solid currentColor;
      }
      .b.Requesting {
        color: var(--ac);
      }
      .sec-t {
        font-size: 11px;
      }
      .meta {
        font-size: 12px;
      }
      header {
        background: var(--bg);
        border-bottom: 1px solid var(--tx);
      }
      .logo {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      .logo i {
        background: none;
        color: var(--ac);
        padding: 0;

      }
      nav button.on,
      nav button:hover {
        background: transparent;
        color: var(--ac);
        text-decoration: underline;
        text-underline-offset: 7px;
      }
      .btn {
        background: var(--tx);
        color: var(--bg);
        border-radius: 6px;
        box-shadow: none;
      }
      .btn:hover {
        background: var(--ac);
        color: #fff;
        box-shadow: none;
        transform: none;
      }
      .btn.ok,
      .btn.er {
        color: #fff;
      }
      .btn.sec:hover {
        background: var(--sf);
        color: var(--tx);
        border-color: var(--tx);
      }
      select,
      input,
      textarea,
      .tg {
        border-radius: 6px;
        background: var(--sf);
      }

      }
      .card:hover {
        transform: translate(-3px, -3px);

      }
      .num,
      .step,
      .item,
      .stat,
      .panel {
        border-radius: 6px;
        box-shadow: none;
      }
      .panel {
        border: 1px solid var(--tx);
        background: var(--bg);
      }
      .num b {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: 68px;
        line-height: 1;
      }
      .av {
        background: var(--tx);
        color: var(--bg);
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      .star {
        color: var(--ac);
      }
      .chip {
        background: transparent;
        border: 1px solid var(--tx);
        border-radius: 4px;
      }
      .chip:hover {
        background: var(--tx);
        color: var(--bg);

      }
      .mq {
        font-family: "Instrument Serif", Georgia, serif;

      }
      .h2 {
        font-size: 52px;
        line-height: 1;
      }
      .rk:hover {
        border-color: var(--tx);
      }

              if (!t.trim()) {

          .querySelectorAll(".fu")
          .forEach(
            (e, k) =>

          cancelAnimationFrame(raf);

            r += (t - r) * 0.07;
            if (Math.abs(t - r) < 0.005) r = t;

          t = 1;
          m.classList.remove("stop");

      $("#nav").addEventListener("mouseover", (e) => {
        const b = e.target.closest("button");
        if (b) ind(b, true);
      });
      $("#nav").addEventListener("mouseleave", () => ind(null));
      addEventListener("resize", () => ind(null));
      if (document.fonts) document.fonts.ready.then(() => ind(null));
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#who")) $("#who").classList.remove("open");
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          close();
          $("#who").classList.remove("open");
        }
        if (
          e.key === "/" &&
          !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)
        ) {
          e.preventDefault();
          S.view = "browse";
          render();
          const i = document.querySelector("[data-f=q]");
          i && i.focus();
        }
      });
      (async () => {
        const saved = +localStorage.getItem("userId");
        if (saved) S.me = saved;
        try {
          await loadAll();
          if (!user(S.me)) S.me = DB.users[0].id;
          render();
        } catch (e) {
          $("#view").innerHTML =
            '<div class="empty"><h1>Can’t reach the backend</h1><p>' +
            esc(e.message) +
            "</p></div>";
        }
      })();
    </script>
  </body>
</html>
