name: Security pipeline

on:
  push:
    paths:
      - 'submission/webies/automated-security-vulnerability-02/**'
      - '.github/workflows/security-*.yml'
  pull_request:
    paths:
      - 'submission/webies/automated-security-vulnerability-02/**'
      - '.github/workflows/security-*.yml'
  workflow_dispatch:
    inputs:
      demo_failure:
        description: 'Generate synthetic vulnerable input and demonstrate a failed security gate'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-test:
    name: App tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submission/webies/automated-security-vulnerability-02/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: submission/webies/automated-security-vulnerability-02/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  sast:
    name: SAST
    uses: ./.github/workflows/security-sast.yml
    with:
      demo_failure: ${{ inputs.demo_failure || false }}

  secrets:
    name: Secrets
    uses: ./.github/workflows/security-secrets.yml
    with:
      demo_failure: ${{ inputs.demo_failure || false }}

  dependencies:
    name: Dependencies
    uses: ./.github/workflows/security-dependencies.yml
    with:
      demo_failure: ${{ inputs.demo_failure || false }}

  container:
    name: Container
    uses: ./.github/workflows/security-container.yml

  gate:
    name: Gate and report
    needs:
      - app-test
      - sast
      - secrets
      - dependencies
      - container
    if: always()
    uses: ./.github/workflows/security-gate.yml
    with:
      demo_failure: ${{ inputs.demo_failure || false }}
      sast_result: ${{ needs.sast.result }}
      secrets_result: ${{ needs.secrets.result }}
      dependencies_result: ${{ needs.dependencies.result }}
      container_result: ${{ needs.container.result }}
