name: Security Pipeline

on:
  push:
    branches: [main, "demo/**", "fix/**", team_CodeCrafters]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Milestone 2 — Static Application Security Testing (SAST)
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep Source Scan
        working-directory: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD":/src -w /src semgrep/semgrep:latest semgrep scan \
            --config p/default --config p/nodejs --config p/secrets \
            --json --output reports/semgrep.json src || true
          chmod -R a+r reports || true

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep
          path: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI/reports/semgrep.json

  # Milestone 3 — Software Composition Analysis (SCA)
  sca:
    name: SCA (Trivy Filesystem & npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI
        run: npm ci || npm install

      - name: Run Unit Tests
        working-directory: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI
        run: node --test

      - name: Run Dependency Scan
        working-directory: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD":/src -w /src aquasec/trivy:latest fs \
            --scanners vuln --ignore-unfixed --ignorefile /src/.trivyignore \
            --format json --output /src/reports/trivy-fs.json /src
          npm audit --json > reports/npm-audit.json || true
          chmod -R a+r reports || true

      - name: Upload SCA Reports
        uses: actions/upload-artifact@v4
        with:
          name: sca
          path: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI/reports/

  # Milestone 4 — Secret Detection
  secrets:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        working-directory: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:latest detect \
            --source /repo --config /repo/.gitleaks.toml \
            --report-format json --report-path /repo/reports/gitleaks.json \
            --exit-code 0
          chmod -R a+r reports || true

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks
          path: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI/reports/gitleaks.json

  # Milestone 5 — Container Image Scanning
  container:
    name: Container Scan (Trivy Image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        working-directory: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI
        run: docker build -t demo-app:${{ github.sha }} .

      - name: Scan Container Image with Trivy
        working-directory: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports":/out -v "$PWD/.trivyignore":/.trivyignore \
            aquasec/trivy:latest image \
            --ignore-unfixed --ignorefile /.trivyignore \
            --format json --output /out/trivy-image.json \
            demo-app:${{ github.sha }}
          chmod -R a+r reports || true

      - name: Upload Container Report
        uses: actions/upload-artifact@v4
        with:
          name: container
          path: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI/reports/trivy-image.json

  # Milestone 6 & 7 — CI/CD Security Gate & Reporting
  gate:
    name: Security Policy Gate & Consolidated Report
    needs: [sast, sca, secrets, container]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Scan Artifacts
        uses: actions/download-artifact@v4
        with:
          path: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI/reports
          merge-multiple: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Evaluate Security Policy & Generate Reports
        working-directory: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI
        run: python3 scripts/report.py

      - name: Upload Consolidated Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: "submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI/report.*"

  # Milestone 8 — AWS Integration (Bonus)
  deploy:
    name: Secure AWS Deployment (ECR, Inspector, S3)
    needs: gate
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/team_CodeCrafters') && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check AWS Deployment Preconditions
        id: aws_check
        env:
          AWS_ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$AWS_ROLE" ] || [ -n "$AWS_KEY" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Neither AWS_ROLE_TO_ASSUME nor AWS_ACCESS_KEY_ID set in repository settings."
            echo "======================================================================"
            echo "🔒 AWS DevSecOps Delivery Gate: PASSED (Pre-deploy security policies verified)"
            echo "📋 Target Architecture:"
            echo "   1. Amazon ECR: demo-app (Scan-on-Push enabled)"
            echo "   2. Amazon Inspector v2: Automated container image CVE vulnerability analysis"
            echo "   3. Amazon S3: devsecops-reports (SSE-AES256 encrypted immutable audit storage)"
            echo "   4. Authentication: Keyless OIDC Role or Encrypted GitHub Secrets"
            echo "💡 To activate live cloud push, configure GitHub Secrets:"
            echo "   - AWS_ROLE_TO_ASSUME (or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY)"
            echo "   - AWS_REGION"
            echo "   - AWS_S3_BUCKET"
            echo "See docs/AWS_INTEGRATION.md for step-by-step setup instructions."
            echo "======================================================================"
          fi

      - name: Download Security Report Artifact
        if: steps.aws_check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: security-report
          path: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI/out

      - name: Configure AWS Credentials
        if: steps.aws_check.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Log in to Amazon ECR
        if: steps.aws_check.outputs.enabled == 'true'
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build, Tag, and Push Hardened Image to ECR
        if: steps.aws_check.outputs.enabled == 'true'
        working-directory: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPO || 'demo-app' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMG="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "✅ Pushed $IMG to Amazon ECR."
          echo "🔍 Amazon Inspector / ECR scan-on-push triggered automatically."

      - name: Verify Amazon Inspector / ECR Scan Status
        if: steps.aws_check.outputs.enabled == 'true'
        env:
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPO || 'demo-app' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Checking ECR image scan findings..."
          aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" --image-id imageTag="$IMAGE_TAG" || echo "Scan in progress or Inspector v2 active."

      - name: Upload Security Reports to Amazon S3
        if: steps.aws_check.outputs.enabled == 'true'
        working-directory: submission/team_CodeCrafters/Automated_Security_Vulnerability_Scanning_in_a_CI
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET || 'devsecops-reports-codecrafters' }}
        run: |
          aws s3 cp out/ s3://$BUCKET/reports/${{ github.sha }}/ --recursive --sse AES256
          aws s3 cp out/report.html s3://$BUCKET/reports/latest/index.html --sse AES256
          echo "✅ Uploaded security reports to s3://$BUCKET/reports/${{ github.sha }}/ with AES-256 SSE."
