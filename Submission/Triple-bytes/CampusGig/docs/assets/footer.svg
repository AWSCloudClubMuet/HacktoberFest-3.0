<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" preserveAspectRatio="none" role="img" aria-label="Decorative animated wave">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#241238"/>
      <stop offset="55%" stop-color="#59368c"/>
      <stop offset="100%" stop-color="#8a5fd1"/>
    </linearGradient>
  </defs>
  <style>
    .w1 { animation: drift 9s ease-in-out infinite alternate; }
    .w2 { animation: drift 13s ease-in-out infinite alternate-reverse; }
    @keyframes drift {
      from { transform: translateX(-60px); }
      to { transform: translateX(60px); }
    }
    text { font-family: 'Segoe UI', Arial, sans-serif; }
  </style>
  <g class="w2" opacity="0.35">
    <path d="M-100 60 C 100 20, 300 100, 500 60 S 900 20, 1300 60 V 140 H -100 Z" fill="url(#wave)"/>
  </g>
  <g class="w1" opacity="0.7">
    <path d="M-100 80 C 150 40, 350 110, 600 78 S 950 40, 1300 82 V 140 H -100 Z" fill="url(#wave)"/>
  </g>
  <rect y="96" width="1200" height="24" fill="url(#wave)"/>
  <text x="600" y="112" font-size="14" fill="#e5d9f5" text-anchor="middle" letter-spacing="2">MADE FOR THE PEOPLE WHO MAKE CAMPUS BETTER</text>
</svg>
